<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Dashboard - Math Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .tutor-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tutor-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tutor-btn:hover,
        .tutor-btn.active {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .sessions {
            display: grid;
            gap: 20px;
        }

        .session-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .session-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .session-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .session-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .students {
            padding: 20px;
        }

        .student-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: center;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .student-name {
            font-weight: 600;
            color: #333;
        }

        .student-contact {
            color: #666;
            font-size: 14px;
        }

        .student-goal {
            color: #667eea;
            font-size: 14px;
        }

        .no-students {
            padding: 20px;
            text-align: center;
            color: #999;
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .session-header {
                grid-template-columns: 1fr;
            }

            .student-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .tutor-selector {
                flex-direction: column;
            }

            .tutor-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 TA Dashboard</h1>
            <p style="color: #666; margin-bottom: 20px;">View student signups for your sessions</p>
            <div class="tutor-selector" id="tutorSelector"></div>
        </div>

        <div id="content">
            <div class="loading">Loading dashboard...</div>
        </div>

        <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
    </div>

    <script>
        const TUTORS = [
            'Neha M.',
            'Nandita S.',
            'Samhithaa S.',
            'Abhiram M.'
        ];

        let selectedTutor = null;

        // Initialize tutor selector
        function initTutorSelector() {
            const selector = document.getElementById('tutorSelector');
            TUTORS.forEach(tutor => {
                const btn = document.createElement('button');
                btn.className = 'tutor-btn';
                btn.textContent = tutor;
                btn.onclick = () => selectTutor(tutor, btn);
                selector.appendChild(btn);
            });
            // Select first tutor by default
            selectTutor(TUTORS[0], selector.children[0]);
        }

        function selectTutor(tutor, btnElement) {
            selectedTutor = tutor;
            document.querySelectorAll('.tutor-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
            loadDashboard();
        }

        async function loadDashboard() {
            if (!selectedTutor) return;

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading signups...</div>';

            try {
                const response = await fetch(
                    `/api/ta-dashboard?tutor=${encodeURIComponent(selectedTutor)}`
                );

                if (!response.ok) {
                    throw new Error('Failed to load dashboard');
                }

                const data = await response.json();
                displayDashboard(data);
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `<div class="error">Error loading dashboard: ${error.message}</div>`;
            }
        }

        function displayDashboard(data) {
            const content = document.getElementById('content');
            let html = `
                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Students</h3>
                        <div class="number">${data.totalStudents}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Sessions</h3>
                        <div class="number">${data.totalSessions}</div>
                    </div>
                </div>

                <div class="sessions">
            `;

            if (data.sessions.length === 0) {
                html += '<div class="no-students">No signups yet</div>';
            } else {
                data.sessions.forEach(session => {
                    const date = new Date(session.date);
                    const dateStr = date.toLocaleDateString('en-US', {
                        weekday: 'long',
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });

                    html += `
                        <div class="session-card">
                            <div class="session-header">
                                <div>
                                    <h2>${dateStr}</h2>
                                </div>
                                <div>
                                    <p><strong>Time:</strong> ${session.time}</p>
                                    <p><strong>Students:</strong> ${session.students.length}/3</p>
                                </div>
                            </div>
                            <div class="students">
                    `;

                    if (session.students.length === 0) {
                        html += '<div class="no-students">No students signed up yet</div>';
                    } else {
                        session.students.forEach(student => {
                            html += `
                                <div class="student-item">
                                    <div>
                                        <div class="student-name">${student.name}</div>
                                    </div>
                                    <div>
                                        <div class="student-contact">
                                            ${student.isEmail ? '📧' : '📞'} ${student.contact}
                                        </div>
                                    </div>
                                    <div>
                                        <div class="student-goal">${student.goal}</div>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += `
                            </div>
                        </div>
                    `;
                });
            }

            html += '</div>';
            content.innerHTML = html;
        }

        // Initialize on load
        initTutorSelector();

        // Refresh every 10 seconds
        setInterval(() => {
            if (selectedTutor) {
                loadDashboard();
            }
        }, 10000);
    </script>
</body>
</html>
